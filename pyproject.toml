[project]
name = "sti-equations"
version = "0.1.0"
description = "Adaptive first-degree equation tutor"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "aiosqlite==0.21.0",
  "alembic==1.16.5",
  "asyncpg==0.30.0",
  "fastapi==0.116.1",
  "fastapi-users[sqlalchemy]==14.0.1",
  "httpx==0.28.1",
  "pandas==2.3.2",
  "pydantic-settings==2.10.1",
  "sqlalchemy==2.0.43",
  "streamlit==1.49.1",
  "sympy==1.14.0",
  "uvicorn[standard]==0.35.0",
]

[dependency-groups]
dev = [
  "import-linter==2.3",
  "pytest==8.4.2",
  "pytest-asyncio==1.1.0",
  "ruff==0.12.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sti_equations"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

