name: ci
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.22"
          enable-cache: true
      - run: uv sync --frozen --all-groups
      - run: uv run ruff check src tests
      - run: uv run lint-imports --no-cache
      - run: uv run pytest -q
